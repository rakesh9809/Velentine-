<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #ff6b9d 100%);
      display: flex;
      flex-direction: column;
      font-family: 'Quicksand', sans-serif;
      overflow-x: hidden;
      position: relative;
      touch-action: pan-y;
    }

    /* Floating hearts background - mobile optimized */
    .bg-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
      opacity: 0.4;
    }

    .floating-heart {
      position: absolute;
      font-size: 24px;
      animation: float 12s infinite ease-in-out;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.3;
      }
      90% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      flex: 1;
      padding: 120px 20px 180px;
      min-height: 100vh;
    }

    h1 {
      color: #fff;
      margin: 0;
      padding: 20px;
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      text-shadow: 0 4px 15px rgba(0,0,0,0.4);
      animation: fadeInDown 0.8s ease-out;
      text-align: center;
      font-family: 'Pacifico', cursive;
      letter-spacing: 1px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: linear-gradient(to bottom, rgba(255,117,140,0.7) 0%, transparent 100%);
      backdrop-filter: blur(5px);
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* HEART - Mobile optimized sizing */
    .heart-container {
      animation: fadeInScale 0.8s ease-out 0.2s backwards;
      margin-top: 40px;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.5);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .heart {
      position: relative;
      width: clamp(140px, 40vw, 200px);
      height: clamp(130px, 37vw, 180px);
      background: linear-gradient(135deg, #ff0844 0%, #ff4169 100%);
      transform: rotate(-45deg);
      animation: beat 1.4s infinite ease-in-out;
      box-shadow: 
        0 0 30px rgba(255,0,0,0.5),
        0 8px 25px rgba(0,0,0,0.3);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: clamp(140px, 40vw, 200px);
      height: clamp(130px, 37vw, 180px);
      background: linear-gradient(135deg, #ff0844 0%, #ff4169 100%);
      border-radius: 50%;
    }

    .heart::before {
      top: calc(clamp(130px, 37vw, 180px) * -0.55);
      left: 0;
    }

    .heart::after {
      left: calc(clamp(140px, 40vw, 200px) * 0.55);
      top: 0;
    }

    @keyframes beat {
      0%, 100% { 
        transform: rotate(-45deg) scale(1); 
      }
      14% { 
        transform: rotate(-45deg) scale(1.1); 
      }
      28% { 
        transform: rotate(-45deg) scale(1); 
      }
      42% { 
        transform: rotate(-45deg) scale(1.1); 
      }
      70% { 
        transform: rotate(-45deg) scale(1); 
      }
    }

    .heart-text {
      position: absolute;
      transform: rotate(45deg);
      color: white;
      text-align: center;
      font-size: clamp(0.85rem, 3.5vw, 1.1rem);
      font-weight: 700;
      width: 100%;
      padding: 10px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      line-height: 1.5;
      z-index: 10;
      pointer-events: none;
    }

    /* BUTTONS - Footer positioned */
    .buttons {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      padding: 20px;
      background: linear-gradient(to top, rgba(255,117,140,0.95) 0%, rgba(255,126,179,0.9) 50%, transparent 100%);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      animation: fadeInUp 0.8s ease-out 0.4s backwards;
      z-index: 100;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    button {
      padding: 18px 45px;
      font-size: clamp(1rem, 4vw, 1.2rem);
      font-weight: 700;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      font-family: 'Quicksand', sans-serif;
      position: relative;
      overflow: hidden;
      min-width: 160px;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Ripple effect for touch */
    button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    button:active::after {
      width: 300px;
      height: 300px;
    }

    #yesBtn {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      color: white;
      animation: pulse 2s infinite;
      position: relative;
      z-index: 10;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 10px 30px rgba(40, 167, 69, 0.5);
      }
    }

    #yesBtn:active {
      transform: scale(0.95) !important;
      animation: none;
    }

    #noBtn {
      background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
      color: white;
      position: relative;
      transition: all 0.3s ease;
      z-index: 5;
    }

    #noBtn:active {
      transform: scale(0.9);
    }

    /* Success Message */
    .success-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    .success-overlay.show {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .success-message {
      background: white;
      padding: 40px 30px;
      border-radius: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 90%;
      transform: scale(0);
      animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.2s forwards;
    }

    @keyframes popIn {
      to {
        transform: scale(1);
      }
    }

    .success-message h2 {
      color: #ff0844;
      font-size: clamp(2rem, 8vw, 3rem);
      margin-bottom: 15px;
      font-family: 'Pacifico', cursive;
    }

    .success-message p {
      color: #666;
      font-size: clamp(1rem, 4vw, 1.3rem);
      margin: 0;
      font-weight: 600;
    }

    /* CONFETTI */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      z-index: 998;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Sparkles for "No" button tap */
    .sparkle {
      position: fixed;
      font-size: 20px;
      pointer-events: none;
      animation: sparkleAnim 0.8s ease-out forwards;
      z-index: 100;
    }

    @keyframes sparkleAnim {
      0% {
        transform: translate(0, 0) scale(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(180deg);
        opacity: 0;
      }
    }

    /* Mobile specific adjustments */
    @media (max-width: 480px) {
      h1 {
        padding: 15px;
        font-size: clamp(1.5rem, 7vw, 2.2rem);
      }

      .content-wrapper {
        padding: 100px 15px 160px;
      }

      .heart-container {
        margin-top: 30px;
      }

      button {
        padding: 16px 40px;
        min-width: 140px;
      }

      .buttons {
        padding: 15px;
      }

      .success-message {
        padding: 35px 25px;
      }
    }

    /* Landscape mobile */
    @media (max-height: 600px) and (orientation: landscape) {
      h1 {
        font-size: 1.3rem;
        padding: 10px;
      }

      .content-wrapper {
        padding: 80px 10px 130px;
      }

      .heart-container {
        margin-top: 20px;
      }

      .buttons {
        padding: 10px;
      }

      button {
        padding: 12px 35px;
      }
    }
  </style>
</head>
<body>

  <!-- Background floating hearts -->
  <div class="bg-hearts" id="bgHearts"></div>

  <div class="content-wrapper">
    <h1>Hello Cutie 💕</h1>

    <div class="heart-container">
      <div class="heart">
        <div class="heart-text">
          Will you be<br>my Valentine? 💖
        </div>
      </div>
    </div>

    <div class="buttons">
      <button id="yesBtn">Yes 💘</button>
      <button id="noBtn">No 💔</button>
    </div>
  </div>

  <!-- Success overlay -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-message">
      <h2>Yayyyy! 💖</h2>
      <p>I knew you'd say yes! 😍</p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const successOverlay = document.getElementById("successOverlay");
    const bgHearts = document.getElementById("bgHearts");

    // Create background floating hearts
    function createBgHearts() {
      for (let i = 0; i < 10; i++) {
        const heart = document.createElement("div");
        heart.classList.add("floating-heart");
        heart.innerHTML = "💗";
        heart.style.left = Math.random() * 100 + "%";
        heart.style.animationDelay = Math.random() * 12 + "s";
        heart.style.animationDuration = (Math.random() * 8 + 8) + "s";
        bgHearts.appendChild(heart);
      }
    }

    createBgHearts();

    // Move "No" button on tap
    let noClickCount = 0;
    const noMessages = [
      "Are you sure? 🥺",
      "Pretty please? 💝",
      "Think again! 🌹",
      "Don't say no! 💔",
      "Give love a chance! 💕"
    ];

    function moveNoBtn(e) {
      e.preventDefault();
      noClickCount++;
      
      // Change button text
      if (noClickCount <= 5) {
        noBtn.textContent = noMessages[noClickCount - 1];
      }
      
      // Make "Yes" button bigger
      const newScale = 1 + (noClickCount * 0.08);
      yesBtn.style.transform = `scale(${Math.min(newScale, 1.5)})`;
      
      // Create sparkles at tap position
      createSparkles(e.touches ? e.touches[0].clientX : e.clientX, 
                     e.touches ? e.touches[0].clientY : e.clientY);
      
      // Vibrate if supported
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }
    }

    // Touch and click events for "No" button
    noBtn.addEventListener("touchstart", moveNoBtn);
    noBtn.addEventListener("click", (e) => {
      if (e.type === 'click' && !e.isTrusted) return; // Prevent synthetic clicks
      moveNoBtn(e);
    });

    // "Yes" button tap
    yesBtn.addEventListener("click", (e) => {
      e.preventDefault();
      
      // Vibrate if supported
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100]);
      }
      
      // Play success sound
      playSuccessSound();
      
      // Show success
      successOverlay.classList.add("show");
      
      // Create celebration
      createConfetti();
      createHeartExplosion();
    });

    // Function to play success sound
    function playSuccessSound() {
      try {
        // Create AudioContext
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Create oscillator for a cheerful melody
        const playNote = (frequency, startTime, duration) => {
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          oscillator.frequency.value = frequency;
          oscillator.type = 'sine';
          
          gainNode.gain.setValueAtTime(0.3, startTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
          
          oscillator.start(startTime);
          oscillator.stop(startTime + duration);
        };
        
        // Play a cheerful melody (C-E-G-C)
        const now = audioContext.currentTime;
        playNote(523.25, now, 0.2);        // C5
        playNote(659.25, now + 0.15, 0.2); // E5
        playNote(783.99, now + 0.3, 0.2);  // G5
        playNote(1046.50, now + 0.45, 0.4); // C6
        
      } catch (error) {
        console.log('Audio not supported');
      }
    }

    // Create confetti
    function createConfetti() {
      const colors = ['#ff0844', '#ff4169', '#ffb6c1', '#ff69b4', '#ff1493', '#ffd700', '#ff6347'];
      
      for (let i = 0; i < 80; i++) {
        setTimeout(() => {
          const confetti = document.createElement("div");
          confetti.classList.add("confetti");
          confetti.style.left = Math.random() * window.innerWidth + "px";
          confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.width = (Math.random() * 8 + 6) + "px";
          confetti.style.height = (Math.random() * 8 + 6) + "px";
          confetti.style.animationDuration = (2 + Math.random() * 2) + "s";
          confetti.style.animationDelay = Math.random() * 0.3 + "s";
          confetti.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
          document.body.appendChild(confetti);

          setTimeout(() => confetti.remove(), 5000);
        }, i * 15);
      }
    }

    // Create heart explosion
    function createHeartExplosion() {
      const hearts = ['💖', '💕', '💗', '💓', '💝', '❤️', '💞'];
      
      for (let i = 0; i < 16; i++) {
        setTimeout(() => {
          const heart = document.createElement("div");
          heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          heart.style.position = "fixed";
          heart.style.left = "50%";
          heart.style.top = "50%";
          heart.style.fontSize = "1.5rem";
          heart.style.pointerEvents = "none";
          heart.style.zIndex = "1000";
          
          const angle = (Math.PI * 2 * i) / 16;
          const velocity = 150 + Math.random() * 100;
          
          document.body.appendChild(heart);
          
          let posX = 0;
          let posY = 0;
          let opacity = 1;
          let scale = 1;
          
          const animate = () => {
            posX += Math.cos(angle) * 4;
            posY += Math.sin(angle) * 4;
            opacity -= 0.015;
            scale -= 0.015;
            
            heart.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
            heart.style.opacity = opacity;
            
            if (opacity > 0) {
              requestAnimationFrame(animate);
            } else {
              heart.remove();
            }
          };
          
          requestAnimationFrame(animate);
        }, i * 40);
      }
    }

    // Create sparkles at tap position
    function createSparkles(x, y) {
      const sparkles = ['✨', '⭐', '💫', '🌟'];
      
      for (let i = 0; i < 6; i++) {
        const sparkle = document.createElement("div");
        sparkle.classList.add("sparkle");
        sparkle.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
        sparkle.style.left = x + "px";
        sparkle.style.top = y + "px";
        
        const angle = (Math.PI * 2 * i) / 6;
        const distance = 30 + Math.random() * 20;
        
        sparkle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
        sparkle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
        
        document.body.appendChild(sparkle);
        
        setTimeout(() => sparkle.remove(), 800);
      }
    }

    // Prevent pull-to-refresh on mobile
    let startY = 0;
    document.addEventListener('touchstart', (e) => {
      startY = e.touches[0].pageY;
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
      const y = e.touches[0].pageY;
      if (window.scrollY === 0 && y > startY) {
        e.preventDefault();
      }
    }, { passive: false });

    // Adjust viewport height on mobile
    function setVH() {
      let vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }

    setVH();
    window.addEventListener('resize', setVH);
  </script>

</body>
</html>
