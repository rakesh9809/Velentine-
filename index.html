<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #ff6b9d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Floating hearts background */
    .bg-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .floating-heart {
      position: absolute;
      opacity: 0.15;
      animation: float 15s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.15;
      }
      90% {
        opacity: 0.15;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      color: #fff;
      margin-bottom: 40px;
      font-size: clamp(2rem, 5vw, 3rem);
      text-shadow: 0 4px 15px rgba(0,0,0,0.4);
      animation: fadeInDown 1s ease-out;
      text-align: center;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* HEART */
    .heart-container {
      animation: fadeInScale 1s ease-out 0.3s backwards;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.5);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .heart {
      position: relative;
      width: 220px;
      height: 200px;
      background: linear-gradient(135deg, #ff0844 0%, #ff4169 100%);
      transform: rotate(-45deg);
      animation: beat 1.2s infinite ease-in-out;
      box-shadow: 
        0 0 40px rgba(255,0,0,0.6),
        0 10px 30px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .heart:hover {
      box-shadow: 
        0 0 60px rgba(255,0,0,0.8),
        0 15px 40px rgba(0,0,0,0.4);
      filter: brightness(1.1);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 200px;
      background: linear-gradient(135deg, #ff0844 0%, #ff4169 100%);
      border-radius: 50%;
    }

    .heart::before {
      top: -110px;
      left: 0;
    }

    .heart::after {
      left: 110px;
      top: 0;
    }

    @keyframes beat {
      0%, 100% { 
        transform: rotate(-45deg) scale(1); 
      }
      25% { 
        transform: rotate(-45deg) scale(1.08); 
      }
      50% { 
        transform: rotate(-45deg) scale(1.15); 
      }
      75% { 
        transform: rotate(-45deg) scale(1.08); 
      }
    }

    .heart-text {
      position: absolute;
      transform: rotate(45deg);
      color: white;
      text-align: center;
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      font-weight: 600;
      width: 100%;
      padding: 10px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      line-height: 1.6;
    }

    /* BUTTONS */
    .buttons {
      margin-top: 50px;
      width: 100%;
      max-width: 500px;
      height: 150px;
      position: relative;
      animation: fadeInUp 1s ease-out 0.6s backwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    button {
      padding: 15px 35px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    button:active::before {
      width: 300px;
      height: 300px;
    }

    #yesBtn {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      color: white;
      position: relative;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 8px 25px rgba(40, 167, 69, 0.5);
      }
    }

    #yesBtn:hover {
      transform: scale(1.1) !important;
      box-shadow: 0 10px 30px rgba(40, 167, 69, 0.6) !important;
    }

    #yesBtn:active {
      transform: scale(0.95) !important;
    }

    #noBtn {
      background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
      color: white;
      position: absolute;
      left: 60%;
      top: 20px;
      transition: all 0.2s ease;
    }

    #noBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(220, 53, 69, 0.5);
    }

    /* Success Message */
    .success-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: white;
      padding: 40px 60px;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      z-index: 1000;
      text-align: center;
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .success-message.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .success-message h2 {
      color: #ff0844;
      font-size: 2.5rem;
      margin-bottom: 15px;
      animation: bounce 0.6s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .success-message p {
      color: #666;
      font-size: 1.2rem;
      margin: 0;
    }

    /* CONFETTI */
    .confetti {
      position: fixed;
      width: 12px;
      height: 12px;
      top: -20px;
      z-index: 999;
      animation: fall 3s linear forwards;
      border-radius: 2px;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Sparkles */
    .sparkle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      animation: sparkle 1s ease-out forwards;
      z-index: 998;
    }

    @keyframes sparkle {
      0% {
        transform: scale(0) rotate(0deg);
        opacity: 1;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: scale(1) rotate(180deg);
        opacity: 0;
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .heart {
        width: 180px;
        height: 160px;
      }

      .heart::before,
      .heart::after {
        width: 180px;
        height: 160px;
      }

      .heart::before {
        top: -90px;
      }

      .heart::after {
        left: 90px;
      }

      button {
        padding: 12px 28px;
        font-size: 1rem;
      }

      .buttons {
        height: 120px;
      }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    button:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }
  </style>
</head>
<body>

  <!-- Background floating hearts -->
  <div class="bg-hearts" id="bgHearts"></div>

  <div class="content-wrapper">
    <h1>Hello Cutie 💕</h1>

    <div class="heart-container">
      <div class="heart">
        <div class="heart-text">
          Will you be<br>my Valentine? 💖
        </div>
      </div>
    </div>

    <div class="buttons">
      <button id="yesBtn" aria-label="Yes, I'll be your Valentine">Yes 💘</button>
      <button id="noBtn" aria-label="No thanks">No 💔</button>
    </div>
  </div>

  <!-- Success message (hidden initially) -->
  <div class="success-message" id="successMsg">
    <h2>Yayyyy! 💖</h2>
    <p>I knew you'd say yes! 😍</p>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const successMsg = document.getElementById("successMsg");
    const bgHearts = document.getElementById("bgHearts");

    // Create background floating hearts
    function createBgHearts() {
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement("div");
        heart.classList.add("floating-heart");
        heart.innerHTML = "💗";
        heart.style.left = Math.random() * 100 + "%";
        heart.style.fontSize = (Math.random() * 30 + 20) + "px";
        heart.style.animationDelay = Math.random() * 15 + "s";
        heart.style.animationDuration = (Math.random() * 10 + 10) + "s";
        bgHearts.appendChild(heart);
      }
    }

    createBgHearts();

    // Move "No" button on hover/click
    let noClickCount = 0;
    const noMessages = [
      "Are you sure? 🥺",
      "Pretty please? 💝",
      "Don't break my heart! 💔",
      "Give me a chance! 🌹",
      "I'll be sad... 😢"
    ];

    function moveNoBtn() {
      noClickCount++;
      
      // Get viewport dimensions
      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;
      
      // Random position within safe bounds
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;
      
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      
      // Change button text occasionally
      if (noClickCount % 3 === 0 && noClickCount <= 15) {
        const msgIndex = Math.min(Math.floor(noClickCount / 3) - 1, noMessages.length - 1);
        noBtn.textContent = noMessages[msgIndex];
      }
      
      // Make "Yes" button grow slightly
      yesBtn.style.transform = `scale(${1 + noClickCount * 0.05})`;
      
      // Create sparkles at old position
      createSparkles(parseFloat(noBtn.style.left), parseFloat(noBtn.style.top));
    }

    noBtn.addEventListener("mouseover", moveNoBtn);
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      moveNoBtn();
    });

    // "Yes" button click
    yesBtn.addEventListener("click", () => {
      // Play celebration
      createConfetti();
      createHeartExplosion();
      
      // Show success message
      setTimeout(() => {
        successMsg.classList.add("show");
      }, 500);
      
      // Hide buttons
      document.querySelector(".buttons").style.opacity = "0";
      document.querySelector(".buttons").style.pointerEvents = "none";
      
      // Try to play sound (will work if user has interacted)
      try {
        const audio = new Audio('https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3');
        audio.play().catch(() => {
          // Silent fail if audio doesn't load
        });
      } catch (e) {
        // Silent fail
      }
    });

    // Create confetti
    function createConfetti() {
      const colors = ['#ff0844', '#ff4169', '#ffb6c1', '#ff69b4', '#ff1493', '#ffd700', '#ff6347'];
      
      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          const confetti = document.createElement("div");
          confetti.classList.add("confetti");
          confetti.style.left = Math.random() * window.innerWidth + "px";
          confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animationDuration = (2 + Math.random() * 3) + "s";
          confetti.style.animationDelay = Math.random() * 0.5 + "s";
          document.body.appendChild(confetti);

          setTimeout(() => confetti.remove(), 6000);
        }, i * 20);
      }
    }

    // Create heart explosion from center
    function createHeartExplosion() {
      const hearts = ['💖', '💕', '💗', '💓', '💝'];
      
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const heart = document.createElement("div");
          heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          heart.style.position = "fixed";
          heart.style.left = "50%";
          heart.style.top = "50%";
          heart.style.fontSize = "2rem";
          heart.style.pointerEvents = "none";
          heart.style.zIndex = "999";
          
          const angle = (Math.PI * 2 * i) / 20;
          const velocity = 200 + Math.random() * 200;
          
          document.body.appendChild(heart);
          
          let posX = 0;
          let posY = 0;
          let opacity = 1;
          
          const animate = () => {
            posX += Math.cos(angle) * 5;
            posY += Math.sin(angle) * 5;
            opacity -= 0.02;
            
            heart.style.transform = `translate(${posX}px, ${posY}px) scale(${opacity})`;
            heart.style.opacity = opacity;
            
            if (opacity > 0) {
              requestAnimationFrame(animate);
            } else {
              heart.remove();
            }
          };
          
          requestAnimationFrame(animate);
        }, i * 50);
      }
    }

    // Create sparkles
    function createSparkles(x, y) {
      for (let i = 0; i < 8; i++) {
        const sparkle = document.createElement("div");
        sparkle.classList.add("sparkle");
        sparkle.style.left = x + "px";
        sparkle.style.top = y + "px";
        
        const angle = (Math.PI * 2 * i) / 8;
        const distance = 30 + Math.random() * 20;
        
        sparkle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
        sparkle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
        
        document.body.appendChild(sparkle);
        
        setTimeout(() => sparkle.remove(), 1000);
      }
    }

    // Keyboard accessibility
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && document.activeElement === yesBtn) {
        yesBtn.click();
      }
    });
  </script>

</body>
</html>
